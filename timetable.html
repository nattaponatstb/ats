<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางสอน</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; color: #333; }

/* ===== HEADER ===== */
header {
  background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
  color: white; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2); position: relative; z-index: 10;
}
header h1 { font-size: 1.3rem; }
.school-subtitle { font-size: 0.78rem; opacity: 0.8; margin-top: 2px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== BUTTONS ===== */
.btn {
  padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 0.83rem; font-weight: 600; transition: opacity 0.2s, transform 0.1s;
}
.btn:hover { opacity: 0.85; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary   { background: #4caf50; color: white; }
.btn-secondary { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); }
.btn-warning   { background: #f57c00; color: white; }
.btn-ghost     { background: none; border: none; cursor: pointer; color: #666; padding: 4px 6px; border-radius: 4px; font-size: 0.82rem; transition: background 0.15s; }
.btn-ghost:hover { background: #f0f0f0; }
.btn-ghost-danger { color: #e53935; }
.btn-ghost-danger:hover { background: #ffebee; }
.btn-small { padding: 5px 10px; font-size: 0.78rem; }

.container { padding: 20px; max-width: 1500px; margin: 0 auto; }

/* ===== TIMETABLE ===== */
.timetable-wrapper { overflow-x: auto; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th {
  background: #1e3a5f; color: white; padding: 11px 8px;
  text-align: center; font-size: 0.85rem; position: sticky; top: 0; z-index: 2;
}
th.day-col  { background: #152d4a; min-width: 88px; }
th.time-col { min-width: 78px; }
td { border: 1px solid #e0e0e0; height: 62px; vertical-align: top; padding: 0; position: relative; }
td.time-cell { background: #f5f7fa; text-align: center; font-size: 0.8rem; color: #555; font-weight: 700; vertical-align: middle; }
td.droppable { cursor: pointer; transition: background 0.15s; }
td.droppable:hover { background: #e8f4fd; }

.class-block {
  position: absolute; inset: 2px; border-radius: 6px; padding: 4px 6px;
  font-size: 0.74rem; cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2); user-select: none; transition: opacity 0.15s;
}
.class-block:hover { opacity: 0.85; }
.class-block .subject-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.class-block .subject-room { font-size: 0.68rem; opacity: 0.85; }
.class-block .del-btn {
  position: absolute; top: 2px; right: 4px; background: none;
  border: none; color: inherit; cursor: pointer; font-size: 0.82rem; opacity: 0.7;
}
.class-block .del-btn:hover { opacity: 1; }

/* ===== SUBJECT LIST ===== */
.subject-list-section {
  background: white; border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 14px; margin-bottom: 18px;
}
.subject-list-section h2 { font-size: 0.95rem; margin-bottom: 10px; color: #1e3a5f; }
.subject-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.subject-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
  color: white; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.2); transition: opacity 0.15s;
}
.subject-chip:hover { opacity: 0.85; }
.subject-chip button { background: none; border: none; color: white; cursor: pointer; font-size: 0.78rem; opacity: 0.7; padding: 0; }

/* ===== MODAL ===== */
.modal-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: white; border-radius: 12px; padding: 24px;
  width: 90%; max-width: 440px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3); animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
.modal h2 { margin-bottom: 16px; font-size: 1.05rem; color: #1e3a5f; }
.form-group { margin-bottom: 13px; }
.form-group label { display: block; margin-bottom: 4px; font-size: 0.83rem; font-weight: 600; color: #555; }
.form-group input, .form-group select {
  width: 100%; padding: 8px 11px; border: 1.5px solid #ccc;
  border-radius: 6px; font-size: 0.88rem; transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: #2d6a9f; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ===== SETTINGS SIDEBAR ===== */
.settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 150; }
.settings-overlay.open { display: block; }
.settings-sidebar {
  position: fixed; top: 0; right: -460px; width: 460px; height: 100vh;
  background: #fff; box-shadow: -4px 0 24px rgba(0,0,0,0.18);
  z-index: 160; display: flex; flex-direction: column;
  transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
}
.settings-sidebar.open { right: 0; }
.settings-header {
  background: linear-gradient(135deg, #1e3a5f, #2d6a9f); color: white; padding: 16px 18px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.settings-header h2 { font-size: 1rem; }
.settings-close {
  background: rgba(255,255,255,0.2); border: none; color: white;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.settings-close:hover { background: rgba(255,255,255,0.35); }
.settings-toolbar {
  padding: 10px 14px; border-bottom: 1px solid #eee;
  display: flex; gap: 8px; flex-shrink: 0; background: #f8f9fa;
}
.settings-body { flex: 1; overflow-y: auto; padding: 12px 0 24px; }

/* ===== ACCORDION — MAIN ===== */
.acc-section {
  border: 1px solid #e0e0e0; border-radius: 10px; margin: 0 12px 10px;
  overflow: hidden; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.acc-header {
  display: flex; align-items: center; gap: 7px;
  padding: 11px 12px; background: #f8f9fb; cursor: pointer;
  user-select: none; border-bottom: 1px solid transparent; transition: background 0.15s;
}
.acc-header:hover { background: #eef2f7; }
.acc-section.expanded > .acc-header { border-bottom-color: #e0e0e0; }
.acc-toggle { font-size: 0.65rem; color: #888; transition: transform 0.25s; flex-shrink: 0; }
.acc-section.expanded > .acc-header .acc-toggle { transform: rotate(90deg); }
.acc-icon { font-size: 1rem; flex-shrink: 0; }
.acc-title { flex: 1; font-size: 0.88rem; font-weight: 700; color: #1e3a5f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acc-title-input {
  flex: 1; border: 1px solid #2d6a9f; border-radius: 5px;
  padding: 3px 8px; font-size: 0.88rem; font-weight: 700; color: #1e3a5f; outline: none;
}
.acc-badge {
  font-size: 0.68rem; background: #e3edf7; color: #2d6a9f;
  padding: 2px 7px; border-radius: 10px; font-weight: 600; flex-shrink: 0;
}
.acc-type-badge {
  font-size: 0.67rem; padding: 2px 6px; border-radius: 8px; font-weight: 600; flex-shrink: 0;
}
.type-timeslots { background: #e3f2fd; color: #1565c0; }
.type-days      { background: #e8f5e9; color: #2e7d32; }
.type-info      { background: #fff3e0; color: #e65100; }
.type-custom    { background: #f3e5f5; color: #6a1b9a; }
.acc-actions { display: flex; gap: 2px; flex-shrink: 0; }
.acc-body { padding: 10px 12px; display: none; }
.acc-section.expanded > .acc-body { display: block; }

/* ===== ITEMS ===== */
.item-row {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: 7px; margin-bottom: 4px;
  background: #f9fafc; border: 1px solid #eee; transition: background 0.1s;
}
.item-row:hover { background: #f0f4f8; }
.item-icon  { font-size: 0.85rem; color: #888; flex-shrink: 0; }
.item-label { font-size: 0.8rem; color: #555; font-weight: 600; min-width: 80px; flex-shrink: 0; }
.item-value { flex: 1; font-size: 0.83rem; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-value-input {
  flex: 1; border: 1px solid #2d6a9f; border-radius: 5px;
  padding: 3px 8px; font-size: 0.83rem; outline: none;
}
.item-actions { display: flex; gap: 2px; flex-shrink: 0; margin-left: auto; }
.toggle-switch { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; background: #ccc; border-radius: 19px; cursor: pointer; transition: background 0.2s;
}
.toggle-slider::before {
  content: ''; position: absolute; width: 13px; height: 13px;
  left: 3px; top: 3px; background: white; border-radius: 50%; transition: transform 0.2s;
}
.toggle-switch input:checked + .toggle-slider { background: #4caf50; }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(15px); }

.add-item-row {
  display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd;
}
.add-item-row input {
  flex: 1; padding: 6px 10px; border: 1.5px solid #ddd; border-radius: 6px;
  font-size: 0.82rem; outline: none; transition: border-color 0.2s;
}
.add-item-row input:focus { border-color: #2d6a9f; }

/* ===== SUB-SECTIONS (Work Calendar Style) ===== */
.subsections-container { margin-top: 10px; }

.sub-section {
  border-radius: 8px; margin-bottom: 8px; overflow: hidden;
  box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  border: 1px solid #e8e8e8;
}
.sub-header {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 12px; cursor: pointer; user-select: none;
  border-bottom: 1px solid transparent; transition: filter 0.15s;
  position: relative;
}
.sub-header::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: 8px 0 0 8px;
  background: var(--sub-color, #2d6a9f);
}
.sub-header:hover { filter: brightness(0.97); }
.sub-section.expanded > .sub-header { border-bottom-color: rgba(0,0,0,0.08); }

.sub-toggle { font-size: 0.6rem; color: rgba(0,0,0,0.45); transition: transform 0.25s; flex-shrink: 0; }
.sub-section.expanded > .sub-header .sub-toggle { transform: rotate(90deg); }

.sub-icon  { font-size: 0.95rem; flex-shrink: 0; }
.sub-title { flex: 1; font-size: 0.83rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-title-input {
  flex: 1; border: 1px solid rgba(0,0,0,0.3); border-radius: 5px;
  padding: 2px 7px; font-size: 0.83rem; font-weight: 700; outline: none; background: rgba(255,255,255,0.6);
}
.sub-count {
  font-size: 0.67rem; padding: 1px 6px; border-radius: 9px; font-weight: 600; flex-shrink: 0;
  background: rgba(0,0,0,0.12); color: inherit;
}
.sub-actions { display: flex; gap: 2px; flex-shrink: 0; }
.sub-actions .btn-ghost { color: rgba(0,0,0,0.5); }
.sub-actions .btn-ghost:hover { background: rgba(0,0,0,0.08); }
.sub-actions .btn-ghost-danger { color: rgba(180,0,0,0.7); }

.sub-body { padding: 8px 10px; background: white; display: none; }
.sub-section.expanded > .sub-body { display: block; }

.sub-item-row {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px; border-radius: 6px; margin-bottom: 3px;
  background: #f9fafc; border: 1px solid #eee; transition: background 0.1s;
  font-size: 0.82rem;
}
.sub-item-row:hover { background: #f0f4f8; }
.sub-item-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  background: var(--sub-color, #2d6a9f);
}
.sub-item-value { flex: 1; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-item-input {
  flex: 1; border: 1px solid #2d6a9f; border-radius: 4px;
  padding: 2px 7px; font-size: 0.82rem; outline: none;
}
.sub-item-actions { display: flex; gap: 2px; margin-left: auto; }

.sub-add-row {
  display: flex; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e0e0e0;
}
.sub-add-row input {
  flex: 1; padding: 5px 9px; border: 1.5px solid #ddd; border-radius: 6px;
  font-size: 0.8rem; outline: none; transition: border-color 0.2s;
}
.sub-add-row input:focus { border-color: #2d6a9f; }

.add-sub-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; margin-top: 10px; border-radius: 8px;
  border: 2px dashed #c5d8f0; color: #2d6a9f; cursor: pointer;
  font-size: 0.82rem; font-weight: 600; background: none;
  transition: border-color 0.2s, background 0.2s; width: 100%;
  justify-content: center;
}
.add-sub-btn:hover { border-color: #2d6a9f; background: #e8f4fd; }

/* ===== TOAST ===== */
#toast {
  position: fixed; bottom: 24px; right: 24px; background: #323232;
  color: white; padding: 11px 18px; border-radius: 8px; font-size: 0.86rem;
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 300;
}
#toast.show { opacity: 1; }

/* ===== CALENDAR COLOR PRESETS ===== */
.color-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.color-dot {
  width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
  transition: border-color 0.15s, transform 0.15s;
}
.color-dot:hover, .color-dot.selected { border-color: #333; transform: scale(1.15); }

@media print {
  header .header-actions, .subject-list-section, #toast,
  .settings-sidebar, .settings-overlay { display: none !important; }
  body { background: white; }
  .timetable-wrapper { box-shadow: none; border: 1px solid #ccc; }
  th { background: #333 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .class-block { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>📅 ตารางสอน</h1>
    <div class="school-subtitle" id="schoolSubtitle"></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="openSettings()">⚙️ ตั้งค่า</button>
    <button class="btn btn-primary"   onclick="openAddSubject()">+ เพิ่มวิชา</button>
    <button class="btn btn-secondary" onclick="saveData()">💾 บันทึก</button>
    <button class="btn btn-secondary" onclick="loadData()">📂 โหลด</button>
    <button class="btn btn-secondary" onclick="window.print()">🖨️ พิมพ์</button>
    <button class="btn btn-warning"   onclick="clearAll()">🗑️ ล้าง</button>
  </div>
</header>

<div class="container">
  <div class="subject-list-section">
    <h2>วิชาทั้งหมด <small style="color:#999;font-weight:400">(คลิกช่องในตารางเพื่อเพิ่มคาบเรียน)</small></h2>
    <div class="subject-chips" id="subjectChips">
      <span style="color:#999;font-size:0.85rem">ยังไม่มีวิชา — กด "+ เพิ่มวิชา"</span>
    </div>
  </div>
  <div class="timetable-wrapper">
    <table id="timetable">
      <thead><tr id="timetableHead"><th class="day-col">วัน</th></tr></thead>
      <tbody id="timetableBody"></tbody>
    </table>
  </div>
</div>

<!-- Settings Sidebar -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-sidebar" id="settingsSidebar">
  <div class="settings-header">
    <h2>⚙️ ตั้งค่าระบบตารางสอน</h2>
    <button class="settings-close" onclick="closeSettings()">✕</button>
  </div>
  <div class="settings-toolbar">
    <button class="btn btn-primary btn-small" onclick="addSection()">+ เพิ่มหัวข้อ</button>
    <button class="btn btn-small" style="background:#eee;color:#333" onclick="applyAndSave()">💾 บันทึกการตั้งค่า</button>
  </div>
  <div class="settings-body" id="settingsBody"></div>
</div>

<!-- Subject Modal -->
<div class="modal-backdrop" id="subjectModal">
  <div class="modal">
    <h2 id="subjectModalTitle">เพิ่มวิชาใหม่</h2>
    <div class="form-group"><label>ชื่อวิชา *</label><input type="text" id="subjectName" placeholder="เช่น คณิตศาสตร์"></div>
    <div class="form-group"><label>รหัสวิชา</label><input type="text" id="subjectCode" placeholder="เช่น MATH101"></div>
    <div class="form-group"><label>ผู้สอน</label><input type="text" id="subjectTeacher" placeholder="เช่น อ.สมชาย"></div>
    <div class="form-group"><label>สี</label><input type="color" id="subjectColor" value="#2196f3"></div>
    <div class="modal-actions">
      <button class="btn" style="background:#eee;color:#333" onclick="closeModal('subjectModal')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveSubject()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Place Class Modal -->
<div class="modal-backdrop" id="placeModal">
  <div class="modal">
    <h2>เพิ่มคาบเรียน</h2>
    <div class="form-group"><label>วิชา *</label><select id="placeSubject"></select></div>
    <div class="form-group"><label>ห้องเรียน</label><input type="text" id="placeRoom" placeholder="เช่น ห้อง 301"></div>
    <div class="form-group">
      <label>จำนวนคาบ</label>
      <select id="placeSpan">
        <option value="1">1 คาบ</option>
        <option value="2">2 คาบ</option>
        <option value="3">3 คาบ</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" style="background:#eee;color:#333" onclick="closeModal('placeModal')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="placeClass()">เพิ่มในตาราง</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────────
const CAL_COLORS = ['#1e88e5','#e53935','#43a047','#f57c00','#8e24aa',
                    '#00897b','#d81b60','#3949ab','#546e7a','#6d4c41'];

const DEFAULT_SETTINGS = {
  sections: [
    {
      id:'timeslots', title:'เวลาเรียน', icon:'🕐', type:'timeslots',
      collapsed:false, locked:true,
      items:['07:00','08:00','09:00','10:00','11:00','12:00',
             '13:00','14:00','15:00','16:00','17:00','18:00',
             '19:00','20:00','21:00'].map((v,i)=>({id:'t'+i,value:v})),
      subsections:[]
    },
    {
      id:'days', title:'วันเรียน', icon:'📆', type:'days',
      collapsed:false, locked:true,
      items:['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์']
             .map((v,i)=>({id:'d'+i,value:v,enabled:true})),
      subsections:[]
    },
    {
      id:'info', title:'ข้อมูลสถานศึกษา', icon:'🏫', type:'info',
      collapsed:true, locked:false,
      items:[
        {id:'i1',label:'ชื่อสถานศึกษา',value:''},
        {id:'i2',label:'ปีการศึกษา',value:''},
        {id:'i3',label:'ภาคเรียน',value:''},
        {id:'i4',label:'ชั้นเรียน',value:''},
      ],
      subsections:[]
    },
    {
      id:'calendar', title:'ปฏิทินการศึกษา', icon:'📚', type:'custom',
      collapsed:false, locked:false,
      items:[],
      subsections:[
        { id:'ss1', title:'ภาคเรียนที่ 1', icon:'🌤️', color:'#1e88e5', collapsed:false,
          items:[{id:'ci1',value:'เปิดเรียน 15 พ.ค.'},{id:'ci2',value:'ปิดเรียน 10 ต.ค.'}] },
        { id:'ss2', title:'ภาคเรียนที่ 2', icon:'❄️', color:'#43a047', collapsed:true,
          items:[{id:'ci3',value:'เปิดเรียน 1 พ.ย.'},{id:'ci4',value:'ปิดเรียน 31 มี.ค.'}] },
      ]
    }
  ]
};

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let sysSettings   = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let subjects      = {};
let schedule      = {};
let editingSubjectId = null;
let pendingCell   = null;

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
const uid      = () => Math.random().toString(36).slice(2,9);
const escHtml  = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const findSec  = id => sysSettings.sections.find(s=>s.id===id);
const findItem = (sec,id) => sec.items.find(i=>i.id===id);
const findSub  = (sec,id) => (sec.subsections||[]).find(s=>s.id===id);
const findSubItem = (sub,id) => sub.items.find(i=>i.id===id);

function getActiveDays()      { const s=findSec('days');      return s?s.items.filter(i=>i.enabled!==false).map(i=>i.value):[]; }
function getActiveTimeSlots() { const s=findSec('timeslots'); return s?s.items.map(i=>i.value):[]; }

function randomColor() {
  const c=['#e53935','#8e24aa','#1e88e5','#00897b','#43a047','#fb8c00','#6d4c41','#546e7a','#d81b60','#3949ab'];
  return c[Math.floor(Math.random()*c.length)];
}
function getContrastColor(hex) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>128?'#000':'#fff';
}
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ─────────────────────────────────────────────
//  TIMETABLE
// ─────────────────────────────────────────────
function buildTable() {
  const DAYS=getActiveDays(), TS=getActiveTimeSlots();
  const thead=document.getElementById('timetableHead');
  thead.innerHTML='<th class="day-col">วัน</th>'+TS.map(t=>`<th class="time-col">${t}</th>`).join('');
  const tbody=document.getElementById('timetableBody');
  tbody.innerHTML='';
  DAYS.forEach((day,di)=>{
    const tr=document.createElement('tr');
    const td0=document.createElement('td'); td0.className='time-cell'; td0.textContent=day; tr.appendChild(td0);
    TS.forEach((_,si)=>{
      const td=document.createElement('td'); td.className='droppable';
      td.dataset.day=di; td.dataset.slot=si;
      td.addEventListener('click',()=>onCellClick(di,si)); tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  renderSchedule(); updateSchoolSubtitle();
}

function renderSchedule() {
  document.querySelectorAll('td.droppable').forEach(td=>{ td.innerHTML=''; td.style.display=''; td.colSpan=1; });
  const occupied=new Set();
  Object.entries(schedule).forEach(([key,entry])=>{
    const [di,si]=key.split('-').map(Number);
    const sub=subjects[entry.subjectId]; if(!sub) return;
    const td=getCellTd(di,si); if(!td||occupied.has(key)) return;
    const span=entry.span||1; td.colSpan=span;
    const block=document.createElement('div');
    block.className='class-block'; block.style.background=sub.color; block.style.color=getContrastColor(sub.color);
    block.innerHTML=`<button class="del-btn" onclick="deleteEntry(event,'${key}')">✕</button>
      <div class="subject-name">${sub.name}</div>
      ${entry.room?`<div class="subject-room">📍 ${entry.room}</div>`:''}
      ${sub.teacher?`<div class="subject-room">👤 ${sub.teacher}</div>`:''}`;
    block.title=[sub.name,sub.code,sub.teacher,entry.room].filter(Boolean).join('\n');
    td.appendChild(block);
    for(let s=1;s<span;s++){const r=getCellTd(di,si+s);if(r){r.style.display='none';occupied.add(`${di}-${si+s}`);}}
  });
}

function getCellTd(di,si) {
  const rows=document.querySelectorAll('#timetableBody tr');
  const row=rows[di]; if(!row) return null;
  return row.querySelectorAll('td.droppable')[si]||null;
}

function updateSchoolSubtitle() {
  const sec=findSec('info'); if(!sec) return;
  const get=lbl=>(sec.items.find(i=>i.label===lbl)||{}).value||'';
  const parts=[get('ชื่อสถานศึกษา'),get('ปีการศึกษา')&&`ปีการศึกษา ${get('ปีการศึกษา')}`,get('ภาคเรียน')&&`ภาคเรียน ${get('ภาคเรียน')}`].filter(Boolean);
  document.getElementById('schoolSubtitle').textContent=parts.join(' • ');
}

function onCellClick(di,si) {
  if(schedule[`${di}-${si}`]) return;
  if(!Object.keys(subjects).length){ showToast('กรุณาเพิ่มวิชาก่อน'); return; }
  pendingCell={dayIdx:di,slotIdx:si}; openPlaceModal();
}

// ─────────────────────────────────────────────
//  SUBJECT CRUD
// ─────────────────────────────────────────────
function openAddSubject() {
  editingSubjectId=null;
  document.getElementById('subjectModalTitle').textContent='เพิ่มวิชาใหม่';
  ['subjectName','subjectCode','subjectTeacher'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('subjectColor').value=randomColor();
  openModal('subjectModal');
}
function editSubject(id) {
  editingSubjectId=id; const s=subjects[id];
  document.getElementById('subjectModalTitle').textContent='แก้ไขวิชา';
  document.getElementById('subjectName').value=s.name;
  document.getElementById('subjectCode').value=s.code||'';
  document.getElementById('subjectTeacher').value=s.teacher||'';
  document.getElementById('subjectColor').value=s.color;
  openModal('subjectModal');
}
function saveSubject() {
  const name=document.getElementById('subjectName').value.trim();
  if(!name){ showToast('กรุณากรอกชื่อวิชา'); return; }
  const id=editingSubjectId||uid();
  subjects[id]={ name, color:document.getElementById('subjectColor').value,
    code:document.getElementById('subjectCode').value.trim(),
    teacher:document.getElementById('subjectTeacher').value.trim() };
  closeModal('subjectModal'); renderChips(); renderSchedule();
  showToast(editingSubjectId?'แก้ไขวิชาแล้ว':'เพิ่มวิชาแล้ว');
}
function deleteSubject(id) {
  if(!confirm(`ลบวิชา "${subjects[id].name}"?`)) return;
  delete subjects[id];
  Object.keys(schedule).forEach(k=>{ if(schedule[k].subjectId===id) delete schedule[k]; });
  renderChips(); buildTable(); showToast('ลบวิชาแล้ว');
}
function renderChips() {
  const el=document.getElementById('subjectChips'), ids=Object.keys(subjects);
  if(!ids.length){ el.innerHTML='<span style="color:#999;font-size:0.85rem">ยังไม่มีวิชา — กด "+ เพิ่มวิชา"</span>'; return; }
  el.innerHTML=ids.map(id=>{ const s=subjects[id];
    return `<div class="subject-chip" style="background:${s.color};color:${getContrastColor(s.color)}" onclick="editSubject('${id}')">
      ${s.name}${s.code?` (${s.code})`:''}
      <button onclick="event.stopPropagation();deleteSubject('${id}')">✕</button></div>`;
  }).join('');
}

// ─────────────────────────────────────────────
//  PLACE CLASS
// ─────────────────────────────────────────────
function openPlaceModal() {
  document.getElementById('placeSubject').innerHTML=
    Object.entries(subjects).map(([id,s])=>`<option value="${id}">${s.name}${s.code?` (${s.code})`:''}</option>`).join('');
  document.getElementById('placeRoom').value='';
  document.getElementById('placeSpan').value='1';
  openModal('placeModal');
}
function placeClass() {
  if(!pendingCell) return;
  const {dayIdx:di,slotIdx:si}=pendingCell;
  const subjectId=document.getElementById('placeSubject').value;
  const room=document.getElementById('placeRoom').value.trim();
  const span=parseInt(document.getElementById('placeSpan').value);
  const slots=getActiveTimeSlots();
  for(let s=0;s<span;s++){
    if(schedule[`${di}-${si+s}`]){ showToast('มีวิชาอยู่แล้ว'); return; }
    if(si+s>=slots.length){ showToast('เกินขอบเขตตาราง'); return; }
  }
  schedule[`${di}-${si}`]={subjectId,room,span};
  closeModal('placeModal'); buildTable(); showToast('เพิ่มคาบเรียนแล้ว');
}
function deleteEntry(e,key){ e.stopPropagation(); delete schedule[key]; buildTable(); showToast('ลบคาบเรียนแล้ว'); }

// ─────────────────────────────────────────────
//  SAVE / LOAD
// ─────────────────────────────────────────────
function saveData() {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({subjects,schedule,sysSettings},null,2)],{type:'application/json'}));
  a.download='timetable.json'; a.click(); showToast('บันทึกไฟล์แล้ว');
}
function loadData() {
  const input=Object.assign(document.createElement('input'),{type:'file',accept:'.json'});
  input.onchange=e=>{ const r=new FileReader();
    r.onload=ev=>{ try{
      const d=JSON.parse(ev.target.result);
      subjects=d.subjects||{}; schedule=d.schedule||{};
      sysSettings=d.sysSettings||JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
      renderChips(); buildTable(); renderSettings(); showToast('โหลดข้อมูลสำเร็จ');
    }catch{ showToast('ไฟล์ไม่ถูกต้อง'); }};
    r.readAsText(e.target.files[0]); };
  input.click();
}
function clearAll() {
  if(!confirm('ล้างตารางทั้งหมด?')) return;
  subjects={}; schedule={}; renderChips(); buildTable(); showToast('ล้างตารางแล้ว');
}

// ─────────────────────────────────────────────
//  RENDER SETTINGS
// ─────────────────────────────────────────────
function renderSettings() {
  document.getElementById('settingsBody').innerHTML =
    sysSettings.sections.map(s=>renderSection(s)).join('');
}

const TYPE_LABEL = { timeslots:'เวลา', days:'วัน', info:'ข้อมูล', custom:'กำหนดเอง' };

function renderSection(sec) {
  const expanded = sec.collapsed ? '' : 'expanded';
  let body = '';
  if(sec.type==='timeslots') body=renderTimeslotItems(sec);
  else if(sec.type==='days') body=renderDayItems(sec);
  else if(sec.type==='info') body=renderInfoItems(sec)+renderSubSections(sec);
  else                       body=renderCustomItems(sec)+renderSubSections(sec);

  const totalItems = (sec.items||[]).length + (sec.subsections||[]).reduce((a,s)=>a+s.items.length,0);

  return `
  <div class="acc-section ${expanded}" id="sec-${sec.id}">
    <div class="acc-header" onclick="toggleSection('${sec.id}')">
      <span class="acc-toggle">▶</span>
      <span class="acc-icon">${sec.icon||'📋'}</span>
      <span class="acc-title" id="atitle-${sec.id}">${escHtml(sec.title)}</span>
      <span class="acc-badge">${totalItems}</span>
      <span class="acc-type-badge type-${sec.type}">${TYPE_LABEL[sec.type]||sec.type}</span>
      <div class="acc-actions" onclick="event.stopPropagation()">
        <button class="btn-ghost" title="แก้ไขชื่อ" onclick="editSectionTitle('${sec.id}')">✏️</button>
        <button class="btn-ghost" title="เปลี่ยนไอคอน" onclick="editSectionIcon('${sec.id}')">🎨</button>
        ${!sec.locked?`<button class="btn-ghost btn-ghost-danger" title="ลบ" onclick="deleteSection('${sec.id}')">🗑️</button>`:''}
      </div>
    </div>
    <div class="acc-body">${body}</div>
  </div>`;
}

// ─────────────────────────────────────────────
//  RENDER ITEMS (special types)
// ─────────────────────────────────────────────
function renderTimeslotItems(sec) {
  return sec.items.map(it=>`
    <div class="item-row" id="item-${it.id}">
      <span class="item-icon">🕐</span>
      <span class="item-value" id="ival-${it.id}">${escHtml(it.value)}</span>
      <div class="item-actions">
        <button class="btn-ghost" onclick="editItem('${sec.id}','${it.id}')">✏️</button>
        <button class="btn-ghost btn-ghost-danger" onclick="deleteItem('${sec.id}','${it.id}')">🗑️</button>
      </div>
    </div>`).join('')+`
    <div class="add-item-row">
      <input type="time" id="new-ts-${sec.id}" step="3600">
      <button class="btn btn-primary btn-small" onclick="addTimeslotItem('${sec.id}')">+ เพิ่ม</button>
    </div>`;
}

function renderDayItems(sec) {
  return sec.items.map(it=>`
    <div class="item-row" id="item-${it.id}">
      <span class="item-icon">📆</span>
      <span class="item-value" id="ival-${it.id}" style="flex:1">${escHtml(it.value)}</span>
      <label class="toggle-switch">
        <input type="checkbox" ${it.enabled!==false?'checked':''} onchange="toggleDay('${sec.id}','${it.id}',this.checked)">
        <span class="toggle-slider"></span>
      </label>
      <div class="item-actions">
        <button class="btn-ghost" onclick="editItem('${sec.id}','${it.id}')">✏️</button>
        <button class="btn-ghost btn-ghost-danger" onclick="deleteItem('${sec.id}','${it.id}')">🗑️</button>
      </div>
    </div>`).join('')+`
    <div class="add-item-row">
      <input type="text" id="new-day-${sec.id}" placeholder="ชื่อวัน">
      <button class="btn btn-primary btn-small" onclick="addDayItem('${sec.id}')">+ เพิ่ม</button>
    </div>`;
}

function renderInfoItems(sec) {
  return sec.items.map(it=>`
    <div class="item-row" id="item-${it.id}">
      <span class="item-label">${escHtml(it.label)}</span>
      <input class="item-value-input" value="${escHtml(it.value)}" placeholder="${escHtml(it.label)}"
        onchange="updateInfoValue('${sec.id}','${it.id}',this.value)">
      <div class="item-actions">
        <button class="btn-ghost" onclick="editInfoLabel('${sec.id}','${it.id}')">✏️</button>
        <button class="btn-ghost btn-ghost-danger" onclick="deleteItem('${sec.id}','${it.id}')">🗑️</button>
      </div>
    </div>`).join('')+`
    <div class="add-item-row">
      <input type="text" id="new-info-${sec.id}" placeholder="ชื่อฟิลด์">
      <button class="btn btn-primary btn-small" onclick="addInfoItem('${sec.id}')">+ เพิ่ม</button>
    </div>`;
}

function renderCustomItems(sec) {
  if(!sec.items.length) return '';
  return sec.items.map(it=>`
    <div class="item-row" id="item-${it.id}">
      <span class="item-icon">•</span>
      <span class="item-value" id="ival-${it.id}" style="flex:1">${escHtml(it.value)}</span>
      <div class="item-actions">
        <button class="btn-ghost" onclick="editItem('${sec.id}','${it.id}')">✏️</button>
        <button class="btn-ghost btn-ghost-danger" onclick="deleteItem('${sec.id}','${it.id}')">🗑️</button>
      </div>
    </div>`).join('');
}

// ─────────────────────────────────────────────
//  RENDER SUB-SECTIONS (Work Calendar Style)
// ─────────────────────────────────────────────
function renderSubSections(sec) {
  const subs = sec.subsections || [];
  const subsHtml = subs.map(sub => renderSubSection(sec.id, sub)).join('');
  return `
  <div class="subsections-container" id="subs-${sec.id}">
    ${subsHtml}
  </div>
  <button class="add-sub-btn" onclick="addSubSection('${sec.id}')">＋ เพิ่มกลุ่มย่อย</button>`;
}

function renderSubSection(secId, sub) {
  const expanded = sub.collapsed ? '' : 'expanded';
  const col      = sub.color || '#2d6a9f';
  const txtCol   = getContrastColor(col);
  const itemsHtml = (sub.items||[]).map(it => renderSubItem(secId, sub.id, it, col)).join('');

  return `
  <div class="sub-section ${expanded}" id="sub-${sub.id}" style="--sub-color:${col}">
    <div class="sub-header" style="background:${col}20; color:${col==='#fff'?'#333':col}" onclick="toggleSubSection('${secId}','${sub.id}')">
      <span class="sub-toggle">▶</span>
      <span class="sub-icon">${sub.icon||'📅'}</span>
      <span class="sub-title" id="stitle-${sub.id}">${escHtml(sub.title)}</span>
      <span class="sub-count">${(sub.items||[]).length} รายการ</span>
      <div class="sub-actions" onclick="event.stopPropagation()">
        <button class="btn-ghost" title="แก้ไขชื่อ" onclick="editSubTitle('${secId}','${sub.id}')">✏️</button>
        <button class="btn-ghost" title="เปลี่ยนสี" onclick="editSubColor('${secId}','${sub.id}')">🎨</button>
        <button class="btn-ghost" title="เปลี่ยน emoji" onclick="editSubIcon('${secId}','${sub.id}')">😀</button>
        <button class="btn-ghost btn-ghost-danger" title="ลบกลุ่ม" onclick="deleteSubSection('${secId}','${sub.id}')">🗑️</button>
      </div>
    </div>
    <div class="sub-body">
      <div id="subitems-${sub.id}">${itemsHtml}</div>
      <div class="sub-add-row">
        <input type="text" id="new-si-${sub.id}" placeholder="เพิ่มรายการ...">
        <button class="btn btn-primary btn-small" onclick="addSubItem('${secId}','${sub.id}')">+ เพิ่ม</button>
      </div>
    </div>
  </div>`;
}

function renderSubItem(secId, subId, it, col) {
  return `
  <div class="sub-item-row" id="sitem-${it.id}">
    <span class="sub-item-dot" style="background:${col}"></span>
    <span class="sub-item-value" id="sval-${it.id}">${escHtml(it.value)}</span>
    <div class="sub-item-actions">
      <button class="btn-ghost" onclick="editSubItem('${secId}','${subId}','${it.id}')">✏️</button>
      <button class="btn-ghost btn-ghost-danger" onclick="deleteSubItem('${secId}','${subId}','${it.id}')">🗑️</button>
    </div>
  </div>`;
}

// Color picker palette for sub-sections
function renderColorPicker(secId, subId, currentColor) {

// ─────────────────────────────────────────────
//  SECTION ACTIONS
// ─────────────────────────────────────────────
function toggleSection(id) {
  const sec=findSec(id); if(sec) sec.collapsed=!sec.collapsed;
  document.getElementById('sec-'+id).classList.toggle('expanded');
}
function editSectionTitle(id) {
  const sec=findSec(id); if(!sec) return;
  const el=document.getElementById('atitle-'+id); const old=sec.title;
  el.outerHTML=`<input class="acc-title-input" id="atitle-inp-${id}" value="${escHtml(old)}"
    onblur="saveSectionTitle('${id}',this.value)"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escHtml(old)}';this.blur()}">`;
  const inp=document.getElementById('atitle-inp-'+id); inp.focus(); inp.select();
}
function saveSectionTitle(id,val) { const s=findSec(id); if(s&&val.trim()) s.title=val.trim(); renderSettings(); buildTable(); }
function editSectionIcon(id) {
  const sec=findSec(id); if(!sec) return;
  const icon=prompt('ใส่ emoji ไอคอน:',sec.icon||'📋');
  if(icon!==null){ sec.icon=icon.trim()||'📋'; renderSettings(); }
}
function deleteSection(id) {
  const sec=findSec(id); if(!sec||sec.locked) return;
  if(!confirm(`ลบหัวข้อ "${sec.title}"?`)) return;
  sysSettings.sections=sysSettings.sections.filter(s=>s.id!==id);
  renderSettings(); showToast('ลบหัวข้อแล้ว');
}
function addSection() {
  const title=prompt('ชื่อหัวข้อใหม่:'); if(!title||!title.trim()) return;
  sysSettings.sections.push({ id:uid(), title:title.trim(), icon:'📋', type:'custom',
    collapsed:false, locked:false, items:[], subsections:[] });
  renderSettings(); showToast('เพิ่มหัวข้อแล้ว');
}

// ─────────────────────────────────────────────
//  ITEM ACTIONS (special types)
// ─────────────────────────────────────────────
function deleteItem(secId,itemId) {
  const sec=findSec(secId); if(!sec) return;
  sec.items=sec.items.filter(i=>i.id!==itemId);
  renderSettings(); if(sec.type==='timeslots'||sec.type==='days') buildTable();
}
function editItem(secId,itemId) {
  const sec=findSec(secId); const it=sec&&findItem(sec,itemId); if(!it) return;
  const el=document.getElementById('ival-'+itemId); const old=it.value;
  el.outerHTML=`<input class="item-value-input" id="iinp-${itemId}" value="${escHtml(old)}"
    onblur="saveItem('${secId}','${itemId}',this.value)"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escHtml(old)}';this.blur()}">`;
  const inp=document.getElementById('iinp-'+itemId); inp.focus(); inp.select();
}
function saveItem(secId,itemId,val) {
  const sec=findSec(secId); const it=sec&&findItem(sec,itemId);
  if(it&&val.trim()) it.value=val.trim();
  renderSettings(); if(sec&&(sec.type==='timeslots'||sec.type==='days')) buildTable();
}
function toggleDay(secId,itemId,checked) {
  const sec=findSec(secId); const it=sec&&findItem(sec,itemId);
  if(it){ it.enabled=checked; buildTable(); }
}
function updateInfoValue(secId,itemId,val) {
  const sec=findSec(secId); const it=sec&&findItem(sec,itemId);
  if(it){ it.value=val; updateSchoolSubtitle(); }
}
function editInfoLabel(secId,itemId) {
  const sec=findSec(secId); const it=sec&&findItem(sec,itemId); if(!it) return;
  const lbl=prompt('ชื่อฟิลด์:',it.label);
  if(lbl&&lbl.trim()){ it.label=lbl.trim(); renderSettings(); }
}
function addTimeslotItem(secId) {
  const inp=document.getElementById('new-ts-'+secId); const val=inp.value.trim();
  if(!val){ showToast('กรุณาเลือกเวลา'); return; }
  findSec(secId).items.push({id:uid(),value:val}); inp.value='';
  renderSettings(); buildTable(); showToast('เพิ่มเวลาแล้ว');
}
function addDayItem(secId) {
  const inp=document.getElementById('new-day-'+secId); const val=inp.value.trim();
  if(!val){ showToast('กรุณากรอกชื่อวัน'); return; }
  findSec(secId).items.push({id:uid(),value:val,enabled:true}); inp.value='';
  renderSettings(); buildTable(); showToast('เพิ่มวันแล้ว');
}
function addInfoItem(secId) {
  const inp=document.getElementById('new-info-'+secId); const val=inp.value.trim();
  if(!val){ showToast('กรุณากรอกชื่อฟิลด์'); return; }
  findSec(secId).items.push({id:uid(),label:val,value:''}); inp.value='';
  renderSettings(); showToast('เพิ่มฟิลด์แล้ว');
}

// ─────────────────────────────────────────────
//  SUB-SECTION ACTIONS
// ─────────────────────────────────────────────
function toggleSubSection(secId,subId) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId); if(!sub) return;
  sub.collapsed=!sub.collapsed;
  document.getElementById('sub-'+subId).classList.toggle('expanded');
}

function addSubSection(secId) {
  const sec=findSec(secId); if(!sec) return;
  const title=prompt('ชื่อกลุ่มย่อย:'); if(!title||!title.trim()) return;
  const color=CAL_COLORS[((sec.subsections||[]).length)%CAL_COLORS.length];
  if(!sec.subsections) sec.subsections=[];
  sec.subsections.push({ id:uid(), title:title.trim(), icon:'📅', color, collapsed:false, items:[] });
  renderSettings(); showToast('เพิ่มกลุ่มย่อยแล้ว');
}

function deleteSubSection(secId,subId) {
  const sec=findSec(secId); if(!sec) return;
  const sub=findSub(sec,subId);
  if(!confirm(`ลบกลุ่ม "${sub?.title}"?`)) return;
  sec.subsections=sec.subsections.filter(s=>s.id!==subId);
  renderSettings(); showToast('ลบกลุ่มย่อยแล้ว');
}

function editSubTitle(secId,subId) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId); if(!sub) return;
  const el=document.getElementById('stitle-'+subId); const old=sub.title;
  el.outerHTML=`<input class="sub-title-input" id="stinp-${subId}" value="${escHtml(old)}"
    onblur="saveSubTitle('${secId}','${subId}',this.value)"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escHtml(old)}';this.blur()}">`;
  const inp=document.getElementById('stinp-'+subId); inp.focus(); inp.select();
}
function saveSubTitle(secId,subId,val) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId);
  if(sub&&val.trim()) sub.title=val.trim(); renderSettings();
}

function editSubIcon(secId,subId) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId); if(!sub) return;
  const icon=prompt('ใส่ emoji:',sub.icon||'📅');
  if(icon!==null){ sub.icon=icon.trim()||'📅'; renderSettings(); }
}

function editSubColor(secId,subId) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId); if(!sub) return;
  // Show inline color picker inside the sub-section header
  const pickerId=`picker-${subId}`;
  if(document.getElementById(pickerId)) return; // already open
  const subEl=document.getElementById('sub-'+subId);
  const pickerHtml=`<div id="${pickerId}" style="padding:8px 14px;background:#f8f9fa;border-top:1px solid #eee">
    <div style="font-size:0.78rem;color:#666;margin-bottom:6px;font-weight:600">เลือกสีกลุ่ม</div>
    <div class="color-presets">${renderColorPicker(secId,subId,sub.color)}</div>
  </div>`;
  subEl.insertAdjacentHTML('beforeend', pickerHtml);
  if(!subEl.classList.contains('expanded')) subEl.classList.add('expanded');
}
function pickSubColor(secId,subId,color,dotEl) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId);
  if(sub){ sub.color=color; }
  const picker=document.getElementById(`picker-${subId}`);
  if(picker) picker.remove();
  renderSettings(); showToast('เปลี่ยนสีแล้ว');
}

// ─────────────────────────────────────────────
//  SUB-ITEM ACTIONS
// ─────────────────────────────────────────────
function addSubItem(secId,subId) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId); if(!sub) return;
  const inp=document.getElementById('new-si-'+subId); const val=inp.value.trim();
  if(!val){ showToast('กรุณากรอกข้อมูล'); return; }
  if(!sub.items) sub.items=[];
  sub.items.push({id:uid(),value:val}); inp.value='';
  renderSettings(); showToast('เพิ่มรายการแล้ว');
}

function editSubItem(secId,subId,itemId) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId);
  const it=sub&&findSubItem(sub,itemId); if(!it) return;
  const el=document.getElementById('sval-'+itemId); const old=it.value;
  el.outerHTML=`<input class="sub-item-input" id="siinp-${itemId}" value="${escHtml(old)}"
    onblur="saveSubItem('${secId}','${subId}','${itemId}',this.value)"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${escHtml(old)}';this.blur()}">`;
  const inp=document.getElementById('siinp-'+itemId); inp.focus(); inp.select();
}
function saveSubItem(secId,subId,itemId,val) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId);
  const it=sub&&findSubItem(sub,itemId);
  if(it&&val.trim()) it.value=val.trim(); renderSettings();
}

function deleteSubItem(secId,subId,itemId) {
  const sec=findSec(secId); const sub=sec&&findSub(sec,subId); if(!sub) return;
  sub.items=sub.items.filter(i=>i.id!==itemId); renderSettings();
}

// ─────────────────────────────────────────────
//  MODAL
// ─────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-backdrop').forEach(el=>
  el.addEventListener('click',e=>{ if(e.target===el) el.classList.remove('open'); }));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    document.querySelectorAll('.modal-backdrop.open').forEach(m=>m.classList.remove('open'));
    closeSettings();
  }
});

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
buildTable();
</script>
</body>
</html>
